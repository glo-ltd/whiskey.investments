<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    color: var(--text-strong);
    background: var(--bg-app);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* faint brand mark watermark */
  #bg-mark {
    position: fixed;
    right: -120px;
    bottom: -140px;
    width: 520px;
    height: 520px;
    opacity: 0.05;
    pointer-events: none;
    z-index: 0;
  }
  #root { position: relative; z-index: 1; width: 100%; display: flex; justify-content: center; }

  /* ---- Slider styling (driven by --calc-accent) ---- */
  .calc-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 8px;
    border-radius: var(--radius-pill);
    background: var(--surface-tint);
    outline: none;
    cursor: pointer;
    margin: 0;
  }
  .calc-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--calc-accent, var(--brand));
    border: 4px solid var(--white);
    box-shadow: 0 2px 8px rgba(40,61,79,0.28);
    cursor: grab;
    transition: transform var(--dur-fast) var(--ease-emphasis);
  }
  .calc-slider:active::-webkit-slider-thumb { cursor: grabbing; transform: scale(1.12); }
  .calc-slider::-moz-range-thumb {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--calc-accent, var(--brand));
    border: 4px solid var(--white);
    box-shadow: 0 2px 8px rgba(40,61,79,0.28);
    cursor: grab;
  }
  .calc-slider:focus-visible { box-shadow: 0 0 0 4px var(--ring); }

  @keyframes calc-pop { 0% { transform: scale(0.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  /* ---------- Button hover interactions ---------- */
  @media (hover: hover) {
    button { transition: transform .18s var(--ease-emphasis), box-shadow .22s var(--ease-standard), background .2s var(--ease-standard), filter .2s var(--ease-standard) !important; }
    button:hover:not(:disabled) { transform: translateY(-1.5px) !important; filter: brightness(1.05); }
    button:active:not(:disabled) { transform: translateY(0) scale(0.98) !important; filter: brightness(0.97); transition-duration: .08s !important; }
  }
</style>
